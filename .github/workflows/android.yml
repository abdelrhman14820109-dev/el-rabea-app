name: Build Android APK

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: el-rabea-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تأكد إن google-services.json موجود
        run: test -f google-services.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت المكتبات
        run: npm install

      - name: إنشاء مشروع الأندرويد
        run: npx cap add android

      - name: إضافة إعدادات Firebase
        run: cp google-services.json android/app/google-services.json

      - name: الأيقونة وشاشة البداية
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: مزامنة الويب مع الأندرويد
        run: npx cap sync android

      - name: بناء الـ APK
        working-directory: el-rabea-app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: el-rabea-apk
          path: el-rabea-app/android/app/build/outputs/apk/debug/app-debug.apk
